<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>채널 추가 요청</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#2347C5}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F7F8FA; color: #15171A; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden">

  <div aria-hidden="true" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px"><span style="width: 30px; height: 30px; border-radius: 9px; background: #2F5BEA"></span><span style="font-size: 20px; font-weight: 700; line-height: 1.3">채널담</span></div>
    <div style="height: 48px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E6EB"></div>
    <div style="display: flex; gap: 12px"><div style="width: 140px; height: 79px; border-radius: 10px; background: #DCE6FF"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px"><div style="height: 12px; border-radius: 4px; background: #E3E6EB"></div><div style="height: 12px; width: 60%; border-radius: 4px; background: #E3E6EB"></div></div></div>
    <div style="display: flex; gap: 12px"><div style="width: 140px; height: 79px; border-radius: 10px; background: #E3EFD9"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px"><div style="height: 12px; border-radius: 4px; background: #E3E6EB"></div><div style="height: 12px; width: 60%; border-radius: 4px; background: #E3E6EB"></div></div></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(21,23,26,0.45)"></div>

  <section role="dialog" aria-labelledby="sheetTitle" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D5D9E0"></div>

    <sc-if value="{{ask}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 52px; height: 52px; border-radius: 999px; background: #E3EFD9; color: #2E5A1C; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">공</div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <h2 id="sheetTitle" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4">공룡 박물관 탐험</h2>
            <span style="font-size: 14px; line-height: 1.4; color: #5B6270">아직 승인되지 않은 채널이에요</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; line-height: 1.4; color: #5B6270; font-weight: 500">요청하는 계기가 된 영상</span>
          <div style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: #F7F8FA">
            <div style="flex: none; width: 96px; height: 54px; border-radius: 8px; background: #E3EFD9"></div>
            <span style="font-size: 16px; font-weight: 600; line-height: 1.4">티라노사우루스 실제 크기 비교</span>
          </div>
        </div>

        <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #33383F">부모님께 이 채널을 추가해 달라고 요청할까요? 승인되면 이 채널의 영상을 모두 볼 수 있고, 알림으로 알려 드려요.</p>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <a href="KidSearch.dc.html" style="height: 52px; border-radius: 12px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #15171A; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">취소</a>
          <button type="button" onClick="{{send}}" style="height: 52px; border-radius: 12px; border: none; background: #2F5BEA; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">요청하기</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; padding: 8px 0 4px">
        <div style="width: 56px; height: 56px; border-radius: 999px; background: #FFF1DB; color: #8A4B00; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12,7 12,12 15,14"></polyline></svg>
        </div>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4">요청을 보냈어요</h2>
        <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #33383F">부모님이 승인하면 알림이 와요.<br>알림을 누르면 이 영상이 바로 열려요.</p>
        <a href="KidSearch.dc.html" style="width: 100%; height: 52px; border-radius: 12px; background: #15171A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">확인</a>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    return {
      ask: !this.state.sent,
      sent: this.state.sent,
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
