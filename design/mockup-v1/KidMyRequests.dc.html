<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 요청</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#2347C5}
.noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F8FA; color: #15171A; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: #2F5BEA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" stroke="none"><path d="M7 3h10a1.5 1.5 0 0 1 1.5 1.5V21l-6.5-4.2L5.5 21V4.5A1.5 1.5 0 0 1 7 3z"></path></svg></span>
      <h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -0.3px">채널담</h1>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 999px; background: #E8EEFF; color: #2347C5; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600" aria-label="지민 프로필">지</div>
  </header>

  <main class="noscroll" style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px">

    <sc-if value="{{notifOff}}" hint-placeholder-val="{{true}}">
      <section aria-labelledby="nt" style="padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 10px; align-items: flex-start">
          <span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: #FFF1DB; color: #8A4B00; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          </span>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <h2 id="nt" style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4">승인 결과를 알림으로 받아요</h2>
            <span style="font-size: 14px; line-height: 1.4; color: #5B6270">iPhone은 홈 화면에 추가한 앱에서 켤 수 있어요.</span>
          </div>
        </div>
        <button type="button" onClick="{{turnOn}}" style="height: 48px; border-radius: 12px; border: none; background: #2F5BEA; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">알림 켜기</button>
      </section>
    </sc-if>
    <sc-if value="{{notifOn}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #1E5B34; padding: 10px 12px; border-radius: 12px; background: #EAF6EE">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"></polyline></svg>
        이 기기에서 승인 결과 알림을 받아요
      </div>
    </sc-if>

    <h2 style="margin: 8px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4">내가 보낸 요청</h2>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #C9D3F5">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #DCE6FF; color: #2347C5; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">과</div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
          <span style="font-size: 16px; font-weight: 600; line-height: 1.4">과학 실험실</span>
          <span style="font-size: 14px; line-height: 1.4; color: #5B6270">방금 승인됐어요</span>
        </div>
        <span style="padding: 3px 8px; border-radius: 999px; background: #E8EEFF; color: #2347C5; font-size: 12px; font-weight: 600">승인</span>
      </div>
      <a href="KidPlayer.dc.html" style="height: 44px; border-radius: 12px; background: #2F5BEA; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF" stroke="none"><polygon points="7,4 20,12 7,20"></polygon></svg>
        요청한 영상 보기
      </a>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB">
      <div style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #E3EFD9; color: #2E5A1C; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">공</div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
        <span style="font-size: 16px; font-weight: 600; line-height: 1.4">공룡 박물관 탐험</span>
        <span style="font-size: 14px; line-height: 1.4; color: #5B6270">12분 전 요청</span>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #FFF1DB; color: #8A4B00; font-size: 12px; font-weight: 600">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12,7 12,12 15,14"></polyline></svg>
        확인 중
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB">
      <div style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #F3E3EA; color: #7A2A4A; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">종</div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
        <span style="font-size: 16px; font-weight: 600; line-height: 1.4">종이접기 공방</span>
        <span style="font-size: 14px; line-height: 1.4; color: #5B6270">어제 요청 · 영상 2개</span>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #FFF1DB; color: #8A4B00; font-size: 12px; font-weight: 600">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12,7 12,12 15,14"></polyline></svg>
        확인 중
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB">
      <div style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #EEF0F3; color: #4A505C; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">게</div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
        <span style="font-size: 16px; font-weight: 600; line-height: 1.4; color: #5B6270">게임 하이라이트 TV</span>
        <span style="font-size: 14px; line-height: 1.4; color: #5B6270">5일 전 · 다시 요청할 수 없어요</span>
      </div>
      <span style="padding: 3px 8px; border-radius: 999px; background: #EEF0F3; color: #4A505C; font-size: 12px; font-weight: 600">거절</span>
    </div>
  </main>

  <nav aria-label="아이 메뉴" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E3E6EB; background: #FFFFFF; padding: 6px 8px 18px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5B6270; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><polygon points="10,9 15,12 10,15" fill="currentColor"></polygon></svg>
      승인 채널 영상
    </a>
    <a href="KidSearch.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5B6270; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      검색
    </a>
    <a href="KidMyRequests.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #2F5BEA; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      내 요청
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notificationsOn":{"editor":"boolean","default":false,"section":"상태"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: null };
  }
  renderVals() {
    const on = this.state.on ?? (this.props.notificationsOn ?? false);
    return {
      notifOn: on,
      notifOff: !on,
      turnOn: () => this.setState({ on: true })
    };
  }
}
</script>
</body>
</html>
