<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가족 관리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#2347C5}
input::placeholder{color:#7A8190}
.noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F8FA; color: #15171A; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: #2F5BEA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" stroke="none"><path d="M7 3h10a1.5 1.5 0 0 1 1.5 1.5V21l-6.5-4.2L5.5 21V4.5A1.5 1.5 0 0 1 7 3z"></path></svg></span>
      <h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -0.3px">채널담</h1>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 999px; background: #15171A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600" aria-label="부모 프로필">엄</div>
  </header>

  <main class="noscroll" style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4">가족 구성원</h2>

    <sc-for list="{{members}}" as="m" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E6EB">
        <div style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: {{m.tint}}; color: {{m.ink}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{m.initial}}</div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
          <span style="font-size: 16px; font-weight: 600; line-height: 1.4">{{m.name}}</span>
          <span style="font-size: 14px; line-height: 1.4; color: #5B6270; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{m.email}}</span>
          <span style="font-size: 14px; line-height: 1.4; color: {{m.statusInk}}">{{m.status}}</span>
        </div>
        <span style="flex: none; padding: 3px 8px; border-radius: 999px; background: {{m.roleBg}}; color: {{m.roleInk}}; font-size: 12px; font-weight: 600">{{m.role}}</span>
        <button type="button" aria-label="{{m.name}} 관리" style="flex: none; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; color: #5B6270; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
        </button>
      </div>
    </sc-for>

    <section aria-labelledby="add" style="margin-top: 8px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB; display: flex; flex-direction: column; gap: 14px">
      <h2 id="add" style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4">구성원 등록</h2>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="em" style="font-size: 14px; font-weight: 600">Google 이메일</label>
        <input id="em" type="email" placeholder="name@gmail.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #E3E6EB; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #15171A; outline: none">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="nm" style="font-size: 14px; font-weight: 600">표시 이름</label>
        <input id="nm" type="text" placeholder="예: 지민" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #E3E6EB; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #15171A; outline: none">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="rl" style="font-size: 14px; font-weight: 600">권한</span>
        <div role="radiogroup" aria-labelledby="rl" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #EBEEF2">
          <sc-if value="{{isChild}}" hint-placeholder-val="{{true}}">
            <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 9px; border: none; background: #FFFFFF; color: #15171A; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(21,23,26,0.08); cursor: pointer">아이</button>
            <button type="button" role="radio" aria-checked="false" onClick="{{pickParent}}" style="height: 40px; border-radius: 9px; border: none; background: transparent; color: #5B6270; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">부모</button>
          </sc-if>
          <sc-if value="{{isParent}}" hint-placeholder-val="{{false}}">
            <button type="button" role="radio" aria-checked="false" onClick="{{pickChild}}" style="height: 40px; border-radius: 9px; border: none; background: transparent; color: #5B6270; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">아이</button>
            <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 9px; border: none; background: #FFFFFF; color: #15171A; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(21,23,26,0.08); cursor: pointer">부모</button>
          </sc-if>
        </div>
        <span style="font-size: 14px; line-height: 1.5; color: #5B6270">{{roleHint}}</span>
      </div>

      <button type="button" style="height: 52px; border-radius: 12px; border: none; background: #2F5BEA; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">등록하기</button>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B6270">등록한 이메일로 Google 로그인하면 자동으로 가족에 연결돼요.</p>
    </section>
  </main>

  <nav aria-label="부모 메뉴" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #E3E6EB; background: #FFFFFF; padding: 6px 8px 18px">
    <a href="ParentInbox.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5B6270; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22,12 16,12 14,15 10,15 8,12 2,12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      <span style="position: absolute; top: 2px; left: 50%; margin-left: 8px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #C2410C; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
      대기함
    </a>
    <a href="ParentChannels.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5B6270; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><polygon points="10,9 15,12 10,15" fill="currentColor"></polygon></svg>
      채널 관리
    </a>
    <a href="ParentFamily.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #2F5BEA; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14a5 5 0 0 1 4.5 5"></path></svg>
      가족
    </a>
    <a href="ParentSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5B6270; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
      설정
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'child' };
  }
  renderVals() {
    const parent = { roleBg: '#15171A', roleInk: '#FFFFFF', tint: '#15171A', ink: '#FFFFFF' };
    const child = { roleBg: '#E8EEFF', roleInk: '#2347C5', tint: '#E8EEFF', ink: '#2347C5' };
    const ok = '#1E5B34';
    const wait = '#8A4B00';
    const isChild = this.state.role === 'child';
    return {
      members: [
        { ...parent, initial: '엄', name: '엄마 (나)', email: '[최초 부모 이메일]', role: '부모', status: '최초 부모 · 연결됨', statusInk: ok },
        { ...parent, initial: '아', name: '아빠', email: '[부모 이메일]', role: '부모', status: '연결됨', statusInk: ok },
        { ...child, initial: '지', name: '지민', email: '[아이 이메일]', role: '아이', status: '프로필 연결됨', statusInk: ok },
        { ...child, initial: '서', name: '서준', email: '[아이 이메일]', role: '아이', status: '아직 로그인하지 않았어요', statusInk: wait }
      ],
      isChild,
      isParent: !isChild,
      pickChild: () => this.setState({ role: 'child' }),
      pickParent: () => this.setState({ role: 'parent' }),
      roleHint: isChild
        ? '아이 프로필이 함께 만들어지고, 승인 모드가 켜진 상태로 시작해요.'
        : '부모는 요청 승인, 채널 관리, 가족 관리, 설정을 모두 할 수 있어요.'
    };
  }
}
</script>
</body>
</html>
